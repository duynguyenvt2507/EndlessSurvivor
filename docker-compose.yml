services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: endless_survivor_mssql
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=EndlessSurvivor@2026!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./backups:/var/opt/mssql/backup

volumes:
  sqlserver_data:
    driver: local